server:
  port: 8080

spring:
  application:
    name: payflow-api
  profiles:
    active: local
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      externalization:
        enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        payflow.transfers: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] [%X{traceId:-},%X{spanId:-}] %-5level %logger{36} - %msg%n"

payflow:
  idempotency:
    ttl-hours: 24
    cleanup-cron: "0 0 * * * *"
  security:
    jwt:
      secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
      expiration-ms: 3600000
    cors:
      allowed-origins: "*"
  upi-validation:
    enabled: true
    base-url: "http://localhost:9090"
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  rate-limit:
    enabled: true
    limit-for-period: 10
    limit-refresh-period-ms: 1000
    timeout-duration-ms: 0
  cache:
    default-ttl-seconds: 600
    users-ttl-seconds: 600
    user-ledgers-ttl-seconds: 60
    caffeine:
      spec: "maximumSize=1000,expireAfterWrite=600s"
  lock:
    wait-time: 2s
    lease-time: 10s
  kafka:
    transfers-topic: payflow.transfers
    topic-partitions: 3
    topic-replicas: 1

resilience4j:
  circuitbreaker:
    instances:
      upiValidation:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50.0
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - org.springframework.web.client.RestClientException
          - java.io.IOException
        ignoreExceptions:
          - com.payflow.exception.InvalidUpiException
  ratelimiter:
    instances:
      transferLimiter:
        registerHealthIndicator: true
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 0
  timelimiter:
    instances:
      upiValidation:
        timeoutDuration: 5s
        cancelRunningFuture: true
      transferLimiter:
        timeoutDuration: 5s
        cancelRunningFuture: false
