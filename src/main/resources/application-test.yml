spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

payflow:
  upi-validation:
    enabled: false
