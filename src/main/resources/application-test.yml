spring:
  config:
    activate:
      on-profile: test

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

payflow:
  upi-validation:
    enabled: false

management:
  health:
    redis:
      enabled: false

resilience4j:
  ratelimiter:
    configs:
      default:
        limitForPeriod: 5
        limitRefreshPeriod: 5s
        timeoutDuration: 0
      transferLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 5s
        timeoutDuration: 0
    instances:
      transferLimiter:
        baseConfig: transferLimiter
        limitForPeriod: 5
        limitRefreshPeriod: 5s
        timeoutDuration: 0
