server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  config:
    activate:
      on-profile: prod-light

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payflowdb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:payflow}
    password: ${SPRING_DATASOURCE_PASSWORD:payflow}
    hikari:
      pool-name: PayflowProdLightHikariPool
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  h2:
    console:
      enabled: false

  modulith:
    events:
      externalization:
        enabled: false

payflow:
  security:
    jwt:
      secret: ${PAYFLOW_SECURITY_JWT_SECRET}
      expiration-ms: 3600000
  cache:
    caffeine:
      spec: "maximumSize=1000,expireAfterWrite=60s"
  lock:
    wait-time: 2s
    lease-time: 10s
