name: Regenerate D2 Architecture Diagrams

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for regenerating diagrams'
        required: false
        default: 'Manual diagram compilation update'

permissions:
  contents: write

jobs:
  generate-diagrams:
    name: Compile D2 Diagrams & Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install D2 Diagram Compiler
        run: |
          curl -fsSL https://d2lang.com/install.sh | sh -s --

      - name: Compile D2 Diagrams to SVGs
        run: |
          chmod +x scripts/generate-diagrams.sh
          ./scripts/generate-diagrams.sh

      - name: Check for SVG Changes
        id: git-diff
        run: |
          if [ -n "$(git status --porcelain docs/assets/diagrams)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Detected SVG changes."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No diagram changes detected."
          fi

      - name: Commit and Push Updated Diagrams
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/assets/diagrams/
          git commit -m "docs(diagrams): regenerate D2 architecture diagrams [skip ci]"
          git push
